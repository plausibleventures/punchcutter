# punchcutter, built and published to punchcutter.plausible.ventures.
#
# The custom domain is carried by `public/CNAME` rather than the repository settings, so the host
# lives in the tree next to the page that claims it. GitHub clears the Pages HTTPS enforcement flag
# whenever the custom domain changes, which is worth knowing before concluding the deploy went wrong.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # The proof run builds every glyph at four corners of the parameter space and asserts the
      # font tables come out well-formed. A letterform that throws fails the deploy, not the tab.
      - run: npm run proof
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
