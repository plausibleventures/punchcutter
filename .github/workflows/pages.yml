# punchcutter, built and published to punchcutter.plausible.ventures.
#
# The custom domain lives in the repository's Pages settings, not in `public/CNAME`. That file is
# still built into the artifact and is worth keeping as a record of which host this tree claims, but
# it does not set anything: a CNAME file only configures the domain for the old branch-based Pages
# build. On a workflow deploy like this one the domain has to be set on the repository, and a site
# that is missing it answers on github.io and nowhere else.
#
# GitHub also clears the Pages HTTPS enforcement flag whenever the custom domain changes, and does
# not put it back. Both are worth knowing before concluding a deploy went wrong.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # The proof run builds every glyph at four corners of the parameter space and asserts the
      # font tables come out well-formed. A letterform that throws fails the deploy, not the tab.
      - run: npm run proof
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
